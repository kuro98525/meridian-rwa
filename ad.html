<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e8e8ec;color:#1d1d1f;font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",sans-serif;padding:44px 24px 80px;-webkit-font-smoothing:antialiased}

  .frames{max-width:1100px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .frame{flex:1 1 250px;max-width:330px}

  .ad--916{aspect-ratio:9/16}
  .ad--warm{background:#fbfaf7;color:#1d1d1f}

  .ad__brand{font-size:3.9cqw;font-weight:500;letter-spacing:.22em}

  .ad__eyebrow{font-size:2.6cqw;letter-spacing:.18em;text-transform:uppercase;color:#8a6d1f;font-weight:500;margin-bottom:4.5cqw}
  .ad__headline{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:9.4cqw;line-height:1.07;letter-spacing:-.018em}
  .ad__headline em{font-style:italic}
  .ad__sub{font-size:3.3cqw;line-height:1.48;color:#6e6e73;margin-top:5cqw}

  .ad__bottom{display:flex;flex-direction:column;align-items:flex-start;gap:3cqw}
  .ad__cta{background:#8a6d1f;color:#fff;font-size:3cqw;font-weight:500;padding:2.6cqw 5.2cqw;border-radius:100px;white-space:nowrap}
  .ad__note{font-size:2.4cqw;color:#86868b;letter-spacing:.02em}

  .ad--11 .ad__headline{font-size:8.2cqw}
  .ad--11 .ad__sub{margin-top:4cqw;font-size:3.1cqw}

  @media (max-width:720px){.frame{flex:1 1 100%;max-width:100%}}
